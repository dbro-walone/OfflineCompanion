[package]
name = "offline-companion"
version = "1.0.0"
edition = "2024"
build = "build.rs"
license = "MIT"

[[bin]]
name = "OfflineCompanion"
path = "src-rust/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
directories = "6.0"
rfd = "0.17"
raw-window-handle = "0.6"
rusqlite = { version = "0.38", features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "raw-window-handle-06", "unstable-winit-030", "compat-1-2"] }
uuid = { version = "1.18", features = ["v4"] }
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
