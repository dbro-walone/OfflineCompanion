name: Build Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore OfflineCompanion.sln

      - name: Build Release (self-contained single-file)
        run: |
          dotnet publish src/Companion.App/Companion.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish

      - name: Package release zip
        shell: pwsh
        run: |
          # 确认 packages 目录存在
          if (Test-Path publish/packages) {
            Write-Host "packages/ 目录存在，内容："
            Get-ChildItem publish/packages -Recurse | ForEach-Object { Write-Host "  $($_.FullName.Replace('publish/',''))" }
          } else {
            Write-Host "⚠️ packages/ 目录不存在！"
          }
          # 把 exe 和 packages 一起打成 zip
          Compress-Archive -Path publish/OfflineCompanion.exe, publish/packages -DestinationPath OfflineCompanion-release.zip -Force
          Write-Host "zip 打包完成"

      - name: Upload release zip
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCompanion-win-x64
          path: OfflineCompanion-release.zip
          retention-days: 30
