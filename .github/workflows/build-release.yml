name: Build Windows Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore OfflineCompanion.sln

      - name: Build Release (self-contained single-file, resources embedded)
        run: |
          dotnet publish src/Companion.App/Companion.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish

      - name: Verify build output
        shell: pwsh
        run: |
          $exe = "publish/OfflineCompanion.exe"
          if (Test-Path $exe) {
            $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
            Write-Host "✅ OfflineCompanion.exe ($size MB)"
          } else {
            Write-Host "❌ exe not found!"
            exit 1
          }
          # Confirm no external packages needed
          $pkgDir = "publish/packages"
          if (Test-Path $pkgDir) {
            Write-Host "⚠️ packages/ dir exists (should be embedded now)"
          } else {
            Write-Host "✅ No external packages/ — resources fully embedded in exe"
          }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: OfflineCompanion-win-x64
          path: publish/OfflineCompanion.exe
          retention-days: 30
